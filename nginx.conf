server {
    listen 80;
    server_name _;
    root /var/www/webpa/src;
    index index.php;

    # Prevent PHP-FPM from processing non-PHP files directly
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Deny access to install directory in production
    location ~ ^/install/ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }
}
